<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>AskInline Settings</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <div class="container">
        <h1>AskInline Settings</h1>
        <form id="options-form">
            <div class="form-group">
                <label for="apiKey">Gemini API Key</label>
                <input type="password" id="apiKey" name="apiKey" placeholder="Enter your API Key">
                <div class="help-text">
                    Get your key from <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a>
                </div>
            </div>

            <div class="form-group">
                <label for="defaultLanguage">Default Language</label>
                <input type="text" id="defaultLanguage" name="defaultLanguage"
                    placeholder="e.g. Italian, English (Leave blank for auto)">
                <div class="help-text">
                    AskInline will try to reply in this language if it's not detected from the context.
                </div>
            </div>

            <div class="form-group">
                <label for="model">Model Name</label>
                <div class="model-row">
                    <select id="model" name="model">
                        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
                    </select>
                    <button type="button" id="refresh-models" title="Refresh available models">🔄</button>
                </div>
                <div id="model-status" class="help-text"></div>
            </div>

            <button type="submit" id="save">Save Settings</button>
            <div id="status"></div>
        </form>
    </div>
    <script src="options.js"></script>
</body>

</html>
